<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | DJ HRMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50">

  <div class="text-center px-6 py-12 max-w-lg mx-auto">

    <!-- Icon -->
    <div class="w-24 h-24 bg-brand-50 rounded-3xl flex items-center justify-center mx-auto mb-6"
      style="background: #f0f4ff;">
      <i class="fas fa-map-location-dot text-4xl" style="color: #4f46e5;"></i>
    </div>

    <!-- 404 Text -->
    <h1 class="text-8xl font-black text-slate-200 leading-none mb-2">404</h1>

    <h2 class="text-2xl font-bold text-slate-700 mb-3">Page Not Found</h2>
    <p class="text-slate-400 text-sm leading-relaxed mb-8">
      This page does not exist or you don't have access to it.<br>
        Please check the URL or use the links below.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="javascript:history.back()"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-100 transition-colors w-full sm:w-auto justify-center">
        <i class="fas fa-arrow-left text-xs"></i> Go Back
      </a>
      <a href="/"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-white text-sm font-semibold hover:opacity-90 transition-all w-full sm:w-auto justify-center"
        style="background: linear-gradient(135deg, #4f46e5, #6366f1)">
        <i class="fas fa-home text-xs"></i> Go to Home
      </a>
    </div>

    <!-- Quick Links -->
    <div class="mt-8 pt-6 border-t border-slate-100">
      <p class="text-slate-400 text-xs mb-3">Quick Links</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="/employee-login/"
          class="text-xs text-indigo-600 hover:underline font-medium">
          <i class="fas fa-user mr-1"></i>Employee Login
        </a>
        <span class="text-slate-300">|</span>
        <a href="/admin-login/"
          class="text-xs text-indigo-600 hover:underline font-medium">
          <i class="fas fa-shield-halved mr-1"></i>Admin Login
        </a>
        <span class="text-slate-300">|</span>
        <a href="/portal/"
          class="text-xs text-indigo-600 hover:underline font-medium">
          <i class="fas fa-gauge mr-1"></i>Employee Portal
        </a>
      </div>
    </div>

    <p class="text-slate-300 text-xs mt-8">DJ HRMS &copy; 2026</p>
  </div>

</body>
</html>
