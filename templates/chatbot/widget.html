<!-- templates/chatbot/widget.html -->
<!-- Include this in base.html before </body> -->

<div id="hrChatbot" style="position:fixed;bottom:24px;right:24px;z-index:9999;font-family:'Inter',system-ui,sans-serif;">

  <!-- Bubble Button -->
  <button id="chatToggle" onclick="toggleChat()"
    style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#6366f1);border:none;cursor:pointer;box-shadow:0 8px 32px rgba(99,102,241,0.4);display:flex;align-items:center;justify-content:center;font-size:22px;color:white;position:relative;transition:transform 0.2s;"
    onmouseover="this.style.transform='scale(1.1)'"
    onmouseout="this.style.transform='scale(1)'">
    💬
    <span id="chatBadge" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;background:#ef4444;border-radius:50%;font-size:10px;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid white;">3</span>
  </button>

  <!-- Chat Window -->
  <div id="chatWindow" style="display:none;position:absolute;bottom:70px;right:0;width:380px;height:560px;background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.15);overflow:hidden;flex-direction:column;border:1px solid #e2e8f0;">

    <!-- Header -->
    <div style="background:linear-gradient(135deg,#4338ca,#6366f1);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;">🤖</div>
        <div>
          <div style="color:white;font-weight:700;font-size:13px;">HR Assistant</div>
          <div style="color:#c7d2fe;font-size:10px;display:flex;align-items:center;gap:4px;">
            <span style="width:5px;height:5px;background:#4ade80;border-radius:50%;display:inline-block;"></span>
            Online · Claude AI
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button onclick="clearChat()" title="Clear" style="background:rgba(255,255,255,0.15);border:none;border-radius:7px;color:white;padding:5px 8px;cursor:pointer;font-size:11px;">🗑️</button>
        <button onclick="toggleChat()" style="background:rgba(255,255,255,0.15);border:none;border-radius:7px;color:white;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;">×</button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div style="padding:10px 12px;border-bottom:1px solid #f1f5f9;background:#fafbff;flex-shrink:0;">
      <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Quick Questions</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;" id="quickActions">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Messages -->
    <div id="chatMessages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;">
      <!-- Messages injected by JS -->
    </div>

    <!-- Input -->
    <div style="padding:10px 12px;border-top:1px solid #f1f5f9;background:white;flex-shrink:0;">
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <textarea id="chatInput" placeholder="Employee ke baare mein poochho..." rows="1"
          style="flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:12px;outline:none;font-family:inherit;color:#334155;resize:none;max-height:70px;line-height:1.4;"
          onfocus="this.style.borderColor='#6366f1'"
          onblur="this.style.borderColor='#e2e8f0'"
          onkeydown="handleKey(event)"></textarea>
        <button onclick="sendMessage()" id="sendBtn"
          style="background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;border:none;border-radius:10px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;">
          ➤
        </button>
      </div>
      <div style="font-size:9px;color:#cbd5e1;text-align:center;margin-top:6px;">Shift+Enter for new line</div>
    </div>
  </div>
</div>

<style>
#chatMessages::-webkit-scrollbar { width: 3px; }
#chatMessages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
.chat-msg-bot { background:#f8fafc;color:#334155;border:1px solid #e2e8f0;border-radius:14px;border-bottom-left-radius:3px;padding:9px 12px;font-size:12px;line-height:1.6;max-width:88%; }
.chat-msg-user { background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;border-radius:14px;border-bottom-right-radius:3px;padding:9px 12px;font-size:12px;line-height:1.6;max-width:88%; }
.qbtn { background:white;border:1px solid #e2e8f0;border-radius:8px;padding:5px 9px;font-size:10px;color:#4f46e5;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s;white-space:nowrap; }
.qbtn:hover { background:#f0f4ff;border-color:#c7d2fe; }
@keyframes chatBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
.tdot { width:5px;height:5px;background:#94a3b8;border-radius:50%;animation:chatBounce 1.2s infinite; }
.tdot:nth-child(2){animation-delay:.2s} .tdot:nth-child(3){animation-delay:.4s}
</style>

<script>
const QUICK = [
  {i:"✅",t:"Who is present today?"},
  {i:"👥",t:"Show all employees"},
  {i:"🏖️",t:"Pending leaves"},
  {i:"🏠",t:"WFH requests"},
  {i:"💻",t:"Engineering team"},
  {i:"📊",t:"Department summary"},
  {i:"❌",t:"Aaj kaun absent hai?"},
];

let chatHistory = [];
let chatOpen = false;

// Init quick actions
document.addEventListener('DOMContentLoaded', () => {
  const qa = document.getElementById('quickActions');
  QUICK.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'qbtn';
    btn.textContent = q.i + ' ' + q.t;
    btn.onclick = () => sendMessage(q.t);
    qa.appendChild(btn);
  });
  addBotMessage("👋 Namaste! Main **HR Assistant** hoon.\n\nEmployee details, attendance, leave requests — sab kuch pooch sakte ho! 😊");
});

function toggleChat() {
  chatOpen = !chatOpen;
  const win = document.getElementById('chatWindow');
  win.style.display = chatOpen ? 'flex' : 'none';
  win.style.flexDirection = 'column';
  if (chatOpen) {
    document.getElementById('chatBadge').style.display = 'none';
    document.getElementById('chatInput').focus();
  }
}

function clearChat() {
  chatHistory = [];
  document.getElementById('chatMessages').innerHTML = '';
  addBotMessage("👋 Chat cleared! Kya poochna chahte ho?");
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addBotMessage(text, isTyping=false) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;gap:3px;';

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;gap:5px;';
  header.innerHTML = `<div style="width:20px;height:20px;background:linear-gradient(135deg,#4f46e5,#6366f1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;">🤖</div><span style="font-size:9px;color:#94a3b8;">HR Assistant · ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;

  const bubble = document.createElement('div');
  bubble.className = 'chat-msg-bot';

  if (isTyping) {
    bubble.innerHTML = '<div style="display:flex;gap:3px;align-items:center;"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>';
    bubble.id = 'typingBubble';
  } else {
    bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br/>');
  }

  div.appendChild(header);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function addUserMessage(text) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end;gap:3px;';
  const bubble = document.createElement('div');
  bubble.className = 'chat-msg-user';
  bubble.textContent = text;
  const time = document.createElement('div');
  time.style.cssText = 'font-size:9px;color:#94a3b8;';
  time.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.appendChild(bubble);
  div.appendChild(time);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage(text) {
  const input = document.getElementById('chatInput');
  const msg = text || input.value.trim();
  if (!msg) return;

  input.value = '';
  input.disabled = true;
  document.getElementById('sendBtn').disabled = true;

  addUserMessage(msg);
  chatHistory.push({ role: 'user', content: msg });

  // Show typing
  addBotMessage('', true);

  try {
    const resp = await fetch('/chatbot/api/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCsrf(),
      },
      body: JSON.stringify({ messages: chatHistory }),
    });

    const data = await resp.json();
    const reply = data.reply || 'Sorry, kuch problem hai. Dobara try karo.';

    // Remove typing indicator
    const typing = document.getElementById('typingBubble');
    if (typing) typing.closest('div[style]').remove();

    addBotMessage(reply);
    chatHistory.push({ role: 'assistant', content: reply });

  } catch(e) {
    const typing = document.getElementById('typingBubble');
    if (typing) typing.closest('div[style]').remove();
    addBotMessage('⚠️ Network error. Please try again.');
  } finally {
    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}

function getCsrf() {
  return document.cookie.split(';').find(c=>c.trim().startsWith('csrftoken='))?.split('=')[1] || '';
}
</script>
