<!-- templates/hr_assistant/widget.html -->
<!-- Naya Employee Self-Service AI Assistant widget. -->
<!-- Include this in templates/portal/base_portal.html before </body> -->

<div id="empAssistant" style="position:fixed;bottom:24px;right:24px;z-index:9999;font-family:'Inter',system-ui,sans-serif;">

  <!-- Bubble Button -->
  <button id="assistantToggle" onclick="assistantToggleWindow()"
    style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#0f766e,#14b8a6);border:none;cursor:pointer;box-shadow:0 8px 32px rgba(20,184,166,0.4);display:flex;align-items:center;justify-content:center;font-size:22px;color:white;transition:transform 0.2s;"
    onmouseover="this.style.transform='scale(1.1)'"
    onmouseout="this.style.transform='scale(1)'">
    🙋
  </button>

  <!-- Chat Window -->
  <div id="assistantWindow" style="display:none;position:absolute;bottom:70px;right:0;width:380px;height:560px;background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.15);overflow:hidden;flex-direction:column;border:1px solid #e2e8f0;">

    <!-- Header -->
    <div style="background:linear-gradient(135deg,#0f766e,#14b8a6);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;">🙋</div>
        <div>
          <div style="color:white;font-weight:700;font-size:13px;">My Assistant</div>
          <div style="color:#ccfbf1;font-size:10px;">Attendance · Leave · Holidays</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button onclick="assistantClearChat()" title="Clear" style="background:rgba(255,255,255,0.15);border:none;border-radius:7px;color:white;padding:5px 8px;cursor:pointer;font-size:11px;">🗑️</button>
        <button onclick="assistantToggleWindow()" style="background:rgba(255,255,255,0.15);border:none;border-radius:7px;color:white;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;">×</button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div style="padding:10px 12px;border-bottom:1px solid #f1f5f9;background:#f0fdfa;flex-shrink:0;">
      <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Quick Questions</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;" id="assistantQuickActions"></div>
    </div>

    <!-- Messages -->
    <div id="assistantMessages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;"></div>

    <!-- Input -->
    <div style="padding:10px 12px;border-top:1px solid #f1f5f9;background:white;flex-shrink:0;">
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <textarea id="assistantInput" placeholder="Apni attendance, leave, holiday poochho..." rows="1"
          style="flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:12px;outline:none;font-family:inherit;color:#334155;resize:none;max-height:70px;line-height:1.4;"
          onfocus="this.style.borderColor='#14b8a6'"
          onblur="this.style.borderColor='#e2e8f0'"
          onkeydown="assistantHandleKey(event)"></textarea>
        <button onclick="assistantSendMessage()" id="assistantSendBtn"
          style="background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;border:none;border-radius:10px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;">
          ➤
        </button>
      </div>
      <div style="font-size:9px;color:#cbd5e1;text-align:center;margin-top:6px;">Shift+Enter for new line</div>
    </div>
  </div>
</div>

<style>
#assistantMessages::-webkit-scrollbar { width: 3px; }
#assistantMessages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
.assistant-msg-bot { background:#f0fdfa;color:#334155;border:1px solid #ccfbf1;border-radius:14px;border-bottom-left-radius:3px;padding:9px 12px;font-size:12px;line-height:1.6;max-width:88%; }
.assistant-msg-user { background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;border-radius:14px;border-bottom-right-radius:3px;padding:9px 12px;font-size:12px;line-height:1.6;max-width:88%; }
.assistant-qbtn { background:white;border:1px solid #99f6e4;border-radius:8px;padding:5px 9px;font-size:10px;color:#0f766e;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s;white-space:nowrap; }
.assistant-qbtn:hover { background:#f0fdfa;border-color:#14b8a6; }
@keyframes assistantBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
.assistant-tdot { width:5px;height:5px;background:#94a3b8;border-radius:50%;animation:assistantBounce 1.2s infinite; }
.assistant-tdot:nth-child(2){animation-delay:.2s} .assistant-tdot:nth-child(3){animation-delay:.4s}
</style>

<script>
const ASSISTANT_QUICK = [
  {i:"📅",t:"What is my attendance status today?"},
  {i:"🏖️",t:"What is my leave balance?"},
  {i:"📝",t:"Show my recent leave requests"},
  {i:"🏠",t:"What is the status of my WFH requests?"},
  {i:"🎉",t:"What are the upcoming holidays?"},
  {i:"⏰",t:"What is my attendance summary this month?"},
];

let assistantHistory = [];
let assistantOpen = false;

document.addEventListener('DOMContentLoaded', () => {
  const qa = document.getElementById('assistantQuickActions');
  ASSISTANT_QUICK.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'assistant-qbtn';
    btn.textContent = q.i + ' ' + q.t;
    btn.onclick = () => assistantSendMessage(q.t);
    qa.appendChild(btn);
  });
  //assistantAddBotMessage("👋 Namaste! Main aapka **Self-Service Assistant** hoon.\n\nApni attendance, leave balance, leave/WFH requests, ya holidays ke baare mein pooch sakte ho! 😊");
  assistantAddBotMessage("👋 Hi! I'm your **Self-Service Assistant**.\n\nAsk me about your attendance, leave balance, leave/WFH requests, or holidays! 😊");
});

function assistantToggleWindow() {
  assistantOpen = !assistantOpen;
  const win = document.getElementById('assistantWindow');
  win.style.display = assistantOpen ? 'flex' : 'none';
  win.style.flexDirection = 'column';
  if (assistantOpen) document.getElementById('assistantInput').focus();
}

function assistantClearChat() {
  assistantHistory = [];
  document.getElementById('assistantMessages').innerHTML = '';
  assistantAddBotMessage("👋 Chat cleared! Kya poochna chahte ho?");
}

function assistantHandleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    assistantSendMessage();
  }
}

function assistantAddBotMessage(text, isTyping=false) {
  const msgs = document.getElementById('assistantMessages');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;gap:3px;';

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;gap:5px;';
  header.innerHTML = `<div style="width:20px;height:20px;background:linear-gradient(135deg,#0f766e,#14b8a6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;">🙋</div><span style="font-size:9px;color:#94a3b8;">Assistant · ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;

  const bubble = document.createElement('div');
  bubble.className = 'assistant-msg-bot';

  if (isTyping) {
    bubble.innerHTML = '<div style="display:flex;gap:3px;align-items:center;"><div class="assistant-tdot"></div><div class="assistant-tdot"></div><div class="assistant-tdot"></div></div>';
    bubble.id = 'assistantTypingBubble';
  } else {
    bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br/>');
  }

  div.appendChild(header);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function assistantAddUserMessage(text) {
  const msgs = document.getElementById('assistantMessages');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end;gap:3px;';
  const bubble = document.createElement('div');
  bubble.className = 'assistant-msg-user';
  bubble.textContent = text;
  const time = document.createElement('div');
  time.style.cssText = 'font-size:9px;color:#94a3b8;';
  time.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.appendChild(bubble);
  div.appendChild(time);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function assistantSendMessage(text) {
  const input = document.getElementById('assistantInput');
  const msg = text || input.value.trim();
  if (!msg) return;

  input.value = '';
  input.disabled = true;
  document.getElementById('assistantSendBtn').disabled = true;

  assistantAddUserMessage(msg);
  assistantHistory.push({ role: 'user', content: msg });

  assistantAddBotMessage('', true);

  try {
    const resp = await fetch('/portal/assistant/api/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': assistantGetCsrf(),
      },
      body: JSON.stringify({ messages: assistantHistory }),
      //body: JSON.stringify({
      //messages: assistantHistory,
      // Jis month/year ka calendar is waqt screen par khula hai (attendance
      // page ke URL se), taaki assistant usi period ka data de -- na ki
      // sirf "aaj" ke around ka. Doosre pages par ye khali honge, jo theek hai.
      //viewed_month: new URLSearchParams(window.location.search).get('month'),
      //viewed_year: new URLSearchParams(window.location.search).get('year'),
    //}),
    });

    const data = await resp.json();
    const reply = data.reply || data.error || 'Sorry, kuch problem hai. Dobara try karo.';

    const typing = document.getElementById('assistantTypingBubble');
    if (typing) typing.closest('div[style]').remove();

    assistantAddBotMessage(reply);
    assistantHistory.push({ role: 'assistant', content: reply });

  } catch (e) {
    const typing = document.getElementById('assistantTypingBubble');
    if (typing) typing.closest('div[style]').remove();
    assistantAddBotMessage('⚠️ Network error. Please try again.');
  } finally {
    input.disabled = false;
    document.getElementById('assistantSendBtn').disabled = false;
    input.focus();
  }
}

function assistantGetCsrf() {
  return document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='))?.split('=')[1] || '';
}
</script>
